name: gap-scout

# Triggered externally by cron-job.org calling the GitHub API's
# workflow_dispatch endpoint at 8:05 AM ET on weekdays (see README).
# GitHub's own `schedule:` cron trigger was removed after it proved
# unreliable in practice -- runs were landing 3.5-5 hours late.
# workflow_dispatch is a normal-priority trigger, not the deprioritized
# schedule queue, so it actually fires on time.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it's not ~8:15am ET right now (for testing)"
        type: boolean
        default: true

jobs:
  run-gap-scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run gap-scout
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_REDIRECT_URI: ${{ secrets.SCHWAB_REDIRECT_URI }}
          SCHWAB_TOKEN_JSON_B64: ${{ secrets.SCHWAB_TOKEN_JSON_B64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_JSON_B64: ${{ secrets.GMAIL_TOKEN_JSON_B64 }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python -m src.gap_scout.main
